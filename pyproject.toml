[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcf-scout"
version = "1.0.0"
description = "PCF-Scout: an agent for retrieving and estimating product carbon footprints, with an EPD-based ground truth"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "kmeans-pytorch==0.3",
    "langgraph==1.1.10",
    "langchain==1.2.17",
    "langchain-exa==1.1.0",
    "langchain-google-genai==4.2.2",
    "langchain-openai==1.2.1",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "pyyaml==6.0.1",
    "python-dotenv==1.2.1",
    "ray==2.55.1",
    "ray[default]==2.55.1",
    "ray[tune]==2.55.1",
    "recbole==1.2.0",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "torch==2.11.0",
    "tabulate==0.9.0",
    "tqdm==4.67.3",
]

[tool.setuptools.packages.find]
include = ["pcf_scout*", "use_case*"]

[project.urls]
"Source" = "https://github.com/swapUniba/react_pcf_retrieval"
